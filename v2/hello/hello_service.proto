syntax = "proto3";

package hello;
option go_package = "github.com/Cr0me1ve/marten-core/v2/hello";
option java_package = "app.marten.core.api.v2.hello";
import "v2/hello/hello.proto";

service Hello {
  rpc SayHello (HelloRequest) returns (HelloResponse);
  rpc SayHelloStream (stream HelloRequest) returns (stream HelloResponse);
}
